version: '3.8'

services:
  zookeeper:
    image: zookeeper:latest
    container_name: resqgrid-zookeeper
    ports:
      - "2181:2181"
    networks:
      - resqgrid-net

  kafka:
    image: wurstmeister/kafka:2.13-2.8.1
    container_name: resqgrid-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_ADVERTISED_HOST_NAME=kafka
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_CREATE_TOPICS=resqgrid-incidents:1:1
    networks:
      - resqgrid-net


  redis:
    image: redis:7.0-alpine
    container_name: resqgrid-redis
    ports:
      - "6379:6379"
    networks:
      - resqgrid-net

  solver-python:
    build:
      context: ./ResQGrid/solver-python
      dockerfile: Dockerfile
    container_name: resqgrid-solver
    ports:
      - "8000:8000"
    networks:
      - resqgrid-net

  backend-go:
    build:
      context: ./ResQGrid/backend-go
      dockerfile: Dockerfile
    container_name: resqgrid-gateway
    depends_on:
      - redis
      - kafka
      - solver-python
    ports:
      - "8080:8080"
    networks:
      - resqgrid-net

  frontend:
    build:
      context: ./ResQGrid/frontend
      dockerfile: Dockerfile
    container_name: resqgrid-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./ResQGrid/frontend:/app
      - /app/node_modules
    networks:
      - resqgrid-net
    environment:
      - CHOKIDAR_USEPOLLING=true

networks:
  resqgrid-net:
    driver: bridge
